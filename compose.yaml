services:
  app:
    build:
      context: .
    environment:
      APP_ENVIRONMENT: development
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sorasense}
      POSTGRES_USER: ${POSTGRES_USER:-sorasense_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SORASENSE_MIGRATOR_PASSWORD: ${SORASENSE_MIGRATOR_PASSWORD:?SORASENSE_MIGRATOR_PASSWORD must be set}
      SORASENSE_APP_PASSWORD: ${SORASENSE_APP_PASSWORD:?SORASENSE_APP_PASSWORD must be set}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?GRAFANA_READER_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db/001-create-roles.sh:/docker-entrypoint-initdb.d/001-create-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migration:
    profiles:
      - tools
    build:
      context: .
    environment:
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_PORT: "5432"
      MIGRATION_DB_NAME: ${POSTGRES_DB:-sorasense}
      MIGRATION_DB_USER: sorasense_migrator
      MIGRATION_DB_PASSWORD: ${SORASENSE_MIGRATOR_PASSWORD:?SORASENSE_MIGRATOR_PASSWORD must be set}
    entrypoint:
      - alembic
    command:
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  device-init:
    profiles:
      - tools
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://sorasense_app:${SORASENSE_APP_PASSWORD:?SORASENSE_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sorasense}
      DEVICE_ID: ${DEVICE_ID:-}
    entrypoint:
      - python
      - -m
      - app.db.device_initializer
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:

networks:
  backend:
    internal: true
