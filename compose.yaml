services:
  app:
    build:
      context: .
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: postgresql+psycopg://sorasense_app:${SORASENSE_APP_PASSWORD:?SORASENSE_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sorasense}
      APP_DEVICE_ID: ${DEVICE_ID:?DEVICE_ID must be set}
      APP_DEVICE_API_KEY_HASH: ${DEVICE_API_KEY_HASH:?DEVICE_API_KEY_HASH must be set}
      APP_WEB_USERNAME: ${WEB_USERNAME:?WEB_USERNAME must be set}
      APP_WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH:?WEB_PASSWORD_HASH must be set}
      APP_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      APP_ALERTS__TEMPERATURE__LOWER: ${TEMPERATURE_LOWER:-10.0}
      APP_ALERTS__TEMPERATURE__UPPER: ${TEMPERATURE_UPPER:-35.0}
      APP_ALERTS__TEMPERATURE__HYSTERESIS: ${TEMPERATURE_HYSTERESIS:-0.5}
      APP_ALERTS__HUMIDITY__LOWER: ${HUMIDITY_LOWER:-30.0}
      APP_ALERTS__HUMIDITY__UPPER: ${HUMIDITY_UPPER:-70.0}
      APP_ALERTS__HUMIDITY__HYSTERESIS: ${HUMIDITY_HYSTERESIS:-2.0}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sorasense}
      POSTGRES_USER: ${POSTGRES_USER:-sorasense_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SORASENSE_MIGRATOR_PASSWORD: ${SORASENSE_MIGRATOR_PASSWORD:?SORASENSE_MIGRATOR_PASSWORD must be set}
      SORASENSE_APP_PASSWORD: ${SORASENSE_APP_PASSWORD:?SORASENSE_APP_PASSWORD must be set}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?GRAFANA_READER_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db/001-create-roles.sh:/docker-entrypoint-initdb.d/001-create-roles.sh:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migration:
    profiles:
      - tools
    build:
      context: .
    environment:
      MIGRATION_DB_HOST: postgres
      MIGRATION_DB_PORT: "5432"
      MIGRATION_DB_NAME: ${POSTGRES_DB:-sorasense}
      MIGRATION_DB_USER: sorasense_migrator
      MIGRATION_DB_PASSWORD: ${SORASENSE_MIGRATOR_PASSWORD:?SORASENSE_MIGRATOR_PASSWORD must be set}
    entrypoint:
      - alembic
    command:
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  device-init:
    profiles:
      - tools
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://sorasense_app:${SORASENSE_APP_PASSWORD:?SORASENSE_APP_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-sorasense}
      DEVICE_ID: ${DEVICE_ID:-}
    entrypoint:
      - python
      - -m
      - app.db.device_initializer
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_EXPLORE_ENABLED: "false"
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?GRAFANA_READER_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-sorasense}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
