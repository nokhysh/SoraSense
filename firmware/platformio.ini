[platformio]
default_envs = native

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
test_filter = test_native
build_src_filter =
    +<measurement_validator.cpp>
    +<measurement_factory.cpp>
    +<retry_controller.cpp>
    +<send_result.cpp>
    +<device_config.cpp>
    +<sensor_freshness.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror

[env:m5stick-cplus2]
platform = espressif32@6.12.0
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    m5stack/M5Unit-ENV@1.7.1
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Utility@0.2.0
    m5stack/M5HAL@0.1.2
    boschsensortec/BME68x Sensor library@1.3.40408
    bblanchon/ArduinoJson@7.4.3
